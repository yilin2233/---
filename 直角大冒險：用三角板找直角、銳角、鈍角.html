<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>直角大冒險：用三角板找直角、銳角、鈍角</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7E8;--ink:#2B2B2B;--green:#2E9E6A;--green-d:#1F7A4F;--orange:#F08A24;--blue:#2F7FD1;--red:#D63A2F;--line:#F0DFBF;--muted:#7a6f60}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--ink);font-size:20px;-webkit-tap-highlight-color:transparent}
#topbar{display:flex;align-items:center;gap:12px;padding:8px 18px;background:#fff;border-bottom:3px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:900;font-size:24px;color:var(--green-d);display:flex;align-items:center;gap:8px}
.brand svg{width:40px;height:40px}
#seatTag{margin-left:auto;font-weight:700;color:var(--muted);font-size:18px}
.screen{display:none;padding:16px;max-width:1400px;margin:0 auto}
.screen.on{display:block}
button{font-family:inherit;font-size:20px;font-weight:700;border-radius:16px;padding:10px 18px;cursor:pointer;min-height:54px;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.12);border:2px solid #E3D3B5;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:none}
button.primary{background:var(--green);color:#fff;border-color:var(--green-d)}
button.accent{background:var(--orange);color:#fff;border-color:#C96A10}
button.small{min-height:40px;font-size:16px;padding:6px 12px}
button:disabled{opacity:.4;cursor:not-allowed}
button.chosen-ok{background:#D7F2E3;border-color:var(--green)}
button.chosen-bad{background:#FFE1D6;border-color:#E07040}
button.pulsebtn{animation:pbtn .9s infinite}
@keyframes pbtn{50%{box-shadow:0 0 0 7px rgba(240,138,36,.55)}}
/* home */
.hero{max-width:760px;margin:30px auto;background:#fff;border:3px solid var(--line);border-radius:28px;padding:30px;text-align:center}
.hero h1{font-size:38px;margin:10px 0;color:var(--green-d)}
.hero p{color:var(--muted);line-height:1.6}
.hero .mascotBig{width:150px;margin:0 auto}
.seatrow{display:flex;gap:12px;justify-content:center;align-items:center;margin:20px 0;flex-wrap:wrap}
.seatrow input{font-size:28px;width:130px;text-align:center;padding:8px;border-radius:14px;border:3px solid #E3D3B5;font-family:inherit}
.linkbtn{background:none;border:none;box-shadow:none;color:var(--muted);text-decoration:underline;font-size:16px;min-height:auto}
/* map */
.maptitle{font-size:28px;font-weight:900;margin:8px 0 16px;color:var(--green-d)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;position:relative}
.node{background:#fff;border:3px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative}
.node h3{margin:0;font-size:24px}
.node .tag{font-size:16px;color:var(--muted);font-weight:700}
.node .desc{font-size:17px;color:#555;line-height:1.5;flex:1}
.node.locked{opacity:.55}
.node .lock{position:absolute;right:16px;top:14px;font-size:28px}
.node .badge{font-size:16px;font-weight:700;color:var(--green-d)}
.stepnum{display:inline-block;align-self:flex-start;background:var(--orange);color:#fff;border-radius:999px;padding:2px 12px;font-size:16px;font-weight:900}
.menuList{display:grid;gap:12px;max-width:760px}
.menuList button{text-align:left;display:flex;justify-content:space-between;align-items:center}
/* play */
#scr-play.on{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:1000px){#scr-play.on{grid-template-columns:1fr}}
.playhead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#pTitle{font-size:24px;font-weight:900;color:var(--green-d)}
#pSub{font-size:17px;color:var(--muted);font-weight:700}
#score{font-size:22px;font-weight:900;display:flex;gap:14px}
.lights{display:flex;gap:8px;flex-wrap:wrap}
.light{padding:6px 12px;border-radius:999px;background:#EEE9DF;font-size:16px;font-weight:700;color:#6b6457}
.light.on{background:#D7F2E3;color:var(--green-d)}
.light.bad{background:#FFE1D6;color:#B4521A}
.stagewrap{background:#fff;border-radius:20px;border:3px solid var(--line);overflow:hidden}
#stage{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;max-height:calc(100vh - 150px);font-family:'Noto Sans TC',system-ui,sans-serif}
.side{display:flex;flex-direction:column;gap:12px}
.bubble{display:flex;gap:10px;background:#fff;border-radius:18px;padding:12px;border:3px solid var(--line);min-height:120px}
.bubble .mascot{width:66px;flex:none}
#msg{font-size:20px;line-height:1.55}
#msg.good{color:var(--green-d)}
#msg.warn{color:#B4521A}
#msg b{color:var(--ink)}
#choices{display:flex;flex-direction:column;gap:10px}
#tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#tools .wide{grid-column:span 2}
#nav{display:flex;gap:8px;flex-wrap:wrap}
#nav button{flex:1 1 auto}
.matchrow{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.matchrow .opts{display:flex;gap:8px}
.matchrow .opts button{flex:1}
.matchrow .opts button.sel{background:#FFF0D6;border-color:var(--orange)}
.choice{display:flex;gap:8px;align-items:stretch}
.choice>button:first-child{flex:1}
button.spk{min-width:56px;padding:0 8px;font-size:22px;flex:none}
button.spk.speaking{background:#FFF0D6;border-color:var(--orange)}
.bubbleCol{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.bubbleCol button.spk{min-height:42px;min-width:52px;font-size:20px}
#ttsPanel{position:absolute;right:14px;top:62px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px;width:min(380px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.12);display:none;z-index:10;font-size:17px}
#ttsPanel.on{display:block}
#ttsPanel select{width:100%;font-size:16px;padding:6px;border-radius:10px;border:2px solid #E3D3B5;font-family:inherit;margin:6px 0 12px}
#ttsPanel .row{display:flex;gap:8px;margin:6px 0 12px}
#ttsPanel .row button{flex:1;min-height:44px;font-size:17px}
#ttsPanel .row button.sel{background:#FFF0D6;border-color:var(--orange)}
/* svg anims */
.blink{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.rulerbody{cursor:grab}
.rothandle{cursor:alias}
/* result */
.resultCard{max-width:820px;margin:20px auto;background:#fff;border:3px solid var(--line);border-radius:28px;padding:26px;text-align:center;position:relative;overflow:hidden}
.resultCard h2{font-size:34px;margin:6px 0;color:var(--green-d)}
.resultCard.fail h2{color:#B4521A}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0;text-align:left}
.stat{background:var(--bg);border-radius:14px;padding:10px 14px}
.stat .k{font-size:15px;color:var(--muted);font-weight:700}
.stat .v{font-size:24px;font-weight:900}
.badgeBig{font-size:22px;font-weight:900;color:#fff;background:linear-gradient(135deg,#F5B83D,#F08A24);display:inline-block;padding:10px 24px;border-radius:999px;margin:8px 0}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.confetti{position:absolute;top:-30px;font-size:26px;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(560px) rotate(360deg);opacity:0}}
/* teacher */
.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:15px}
.tbl th,.tbl td{border:1px solid #E6D8BC;padding:6px 8px;text-align:center;white-space:nowrap}
.tbl th{background:#FFF0D6}
.tblwrap{overflow:auto;border-radius:14px;border:2px solid var(--line)}
.tcontrols{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.tcontrols input{font-size:20px;width:100px;padding:6px;border-radius:10px;border:2px solid #E3D3B5;font-family:inherit}
textarea{width:100%;height:140px;font-size:13px;font-family:monospace;border-radius:12px;border:2px solid var(--line);padding:8px}
.note{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<header id="topbar">
  <div class="brand"><span id="brandIcon"></span>直角大冒險</div>
  <span id="seatTag"></span>
  <button class="small" id="btnAuto" title="自動唸讀">🔊 自動唸讀：開</button>
  <button class="small" id="btnTtsSet" title="聲音設定">⚙ 聲音</button>
  <button class="small" id="btnTopMap" style="display:none">🗺 關卡地圖</button>
  <div id="ttsPanel">
    <b>🔊 唸讀聲音設定</b>
    <div style="margin-top:10px">聲音（建議選名稱有「Natural／自然／加強版／Google」的）</div>
    <select id="ttsVoice"></select>
    <div>速度</div>
    <div class="row" id="ttsRates"><button data-r="0.8">慢一點</button><button data-r="0.92">剛剛好</button><button data-r="1.05">快一點</button></div>
    <div class="row"><button class="primary" id="ttsTest">▶ 試聽</button><button id="ttsClose">關閉</button></div>
    <div class="note" id="ttsNote"></div>
  </div>
</header>

<main>
<!-- 首頁 -->
<section id="scr-home" class="screen">
  <div class="hero">
    <div class="mascotBig" id="heroMascot"></div>
    <h1>直角大冒險</h1>
    <p>和貓頭鷹「角角」一起，用三角板的直角<br>找出<b>直角</b>、<b>銳角</b>和<b>鈍角</b>！</p>
    <div class="seatrow">
      <label for="seatInput" style="font-weight:700">我的座號</label>
      <input id="seatInput" type="number" inputmode="numeric" min="1" max="99" placeholder="例如 7">
      <button class="primary" id="btnStart">開始冒險 ▶</button>
    </div>
    <div id="homeErr" class="note"></div>
    <button class="linkbtn" id="btnTeacher">老師檢視</button>
  </div>
</section>

<!-- 地圖 -->
<section id="scr-map" class="screen">
  <div class="maptitle">🗺 關卡地圖</div>
  <div class="map" id="mapGrid"></div>
</section>

<!-- 小教室目錄 -->
<section id="scr-review" class="screen">
  <div class="maptitle">📘 直角小教室</div>
  <p class="note">三站都完成，就可以挑戰「進場小測驗」，拿到入場券！</p>
  <div class="menuList" id="reviewList"></div>
</section>

<!-- 操作畫面 -->
<section id="scr-play" class="screen">
  <div class="playhead">
    <div><div id="pTitle"></div><div id="pSub"></div></div>
    <div class="lights" id="lights"></div>
    <div id="score"><span id="starsTxt"></span><span id="heartsTxt"></span></div>
  </div>
  <div class="stagewrap"><svg id="stage" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="side">
    <div class="bubble"><div class="bubbleCol"><div class="mascot" id="bubbleMascot"></div><button class="spk" id="btnSay" aria-label="再唸一次">🔊</button></div><div id="msg"></div></div>
    <div id="choices"></div>
    <div id="tools">
      <button class="primary wide" id="btnCheck">✅ 我放好了</button>
      <button id="btnRotL">⟲ 左轉一點</button>
      <button id="btnRotR">⟳ 右轉一點</button>
      <button id="btnFlip">🔄 翻面</button>
      <button id="btnSwap">📐 換三角板</button>
      <button id="btnReset">↩ 重來</button>
      <button class="accent" id="btnHelp">💡 我需要提示</button>
    </div>
    <div id="nav"></div>
  </div>
</section>

<!-- 結果 -->
<section id="scr-result" class="screen"><div class="resultCard" id="resultCard"></div></section>

<!-- 老師 -->
<section id="scr-teacher" class="screen">
  <div class="maptitle">👩‍🏫 老師檢視</div>
  <p class="note">紀錄存在「這台裝置」的瀏覽器裡。每台裝置的紀錄要分別到該裝置查看。</p>
  <div class="tcontrols">
    <button class="small" id="btnTBack">← 回首頁</button>
    <span>座號</span><input id="tSeat" type="number" min="1" max="99">
    <button class="small" id="btnTSkip">解鎖全部關卡（跳關示範）</button>
    <button class="small" id="btnTClear">清除全部紀錄</button>
    <span id="tInfo" class="note"></span>
  </div>
  <div class="tblwrap"><table class="tbl" id="tTable"></table></div>
  <h3>匯出 CSV</h3>
  <div class="tcontrols"><button class="small primary" id="btnCopy">📋 複製 CSV</button><span class="note">複製後貼到 Excel 或 Google 試算表即可。</span></div>
  <textarea id="csvOut" readonly></textarea>
</section>
</main>

<script>
"use strict";
/* ========== 小工具 ========== */
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
function E(tag,attrs,parent){const n=document.createElementNS(NS,tag);if(attrs)for(const k in attrs){if(k==='text')n.textContent=attrs[k];else n.setAttribute(k,attrs[k]);}if(parent)parent.appendChild(n);return n;}
function HT(tag,props,parent){const n=document.createElement(tag);if(props)for(const k in props){if(k==='html')n.innerHTML=props[k];else if(k==='text')n.textContent=props[k];else if(k==='on')n.addEventListener('click',props[k]);else if(k==='cls')n.className=props[k];else n.setAttribute(k,props[k]);}if(parent)parent.appendChild(n);return n;}
const D2R=Math.PI/180;
const dir=a=>({x:Math.cos(a*D2R),y:Math.sin(a*D2R)});
const add=(p,v,k=1)=>({x:p.x+v.x*k,y:p.y+v.y*k});
const dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
const angOf=v=>Math.atan2(v.y,v.x)/D2R;
const n180=a=>((a+180)%360+360)%360-180;
const adiff=(a,b)=>Math.abs(n180(a-b));
const cross=(u,v)=>u.x*v.y-u.y*v.x;
const sgn=x=>x>1e-9?1:x<-1e-9?-1:0;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ========== 唸讀（瀏覽器內建語音，自動挑最自然的中文聲音） ========== */
const TTS={ok:'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window,on:true,rate:0.92,voiceURI:null,voices:[]};
try{const p=JSON.parse(localStorage.getItem('rightAngleAdventure_tts'));if(p){TTS.on=p.on!==false;TTS.rate=p.rate||0.92;TTS.voiceURI=p.voiceURI||null;}}catch(e){}
function saveTTS(){try{localStorage.setItem('rightAngleAdventure_tts',JSON.stringify({on:TTS.on,rate:TTS.rate,voiceURI:TTS.voiceURI}));}catch(e){}}
function voiceScore(v){let s=0;const l=(v.lang||'').replace('_','-').toLowerCase(),n=v.name||'';
  if(/tw|hant/.test(l)||/臺灣|台灣|taiwan/i.test(n))s+=50;else if(/cn|hans/.test(l))s+=22;else s+=10;
  if(/natural|neural|online|premium|enhanced|自然|加強|優化|高品質/i.test(n))s+=35;
  if(/google/i.test(n))s+=14;
  if(/hsiaochen|hsiaoyu|yunjhe|meijia|美佳|曉臻|曉雨/i.test(n))s+=8;
  if(/eloquence|compact|espeak/i.test(n))s-=30;
  return s;}
function loadVoices(){if(!TTS.ok)return;const all=speechSynthesis.getVoices()||[];
  TTS.voices=all.filter(v=>/^(zh|cmn|yue)/i.test(v.lang||'')||/中文|國語|普通話|chinese|mandarin/i.test(v.name||'')).sort((a,b)=>voiceScore(b)-voiceScore(a));
  fillVoiceSelect();}
function curVoice(){return TTS.voices.find(v=>v.voiceURI===TTS.voiceURI)||TTS.voices[0]||null;}
if(TTS.ok){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,800);}
const _tmp=document.createElement('div');
function speechText(html){_tmp.innerHTML=String(html).replace(/<br\s*\/?>/gi,'。');let t=_tmp.textContent||'';
  t=t.replace(/∟/g,'直角記號').replace(/→/g,'，').replace(/（提示第 (\d) 層）/g,'提示第$1層。').replace(/……/g,'，').replace(/——/g,'，').replace(/①/g,'第一步，').replace(/②/g,'第二步，').replace(/③/g,'第三步，')
     .replace(/[★☆✔✘○⟲⟳↻↩←▶🔊]/g,'').replace(/\p{Extended_Pictographic}/gu,'').replace(/[️‍]/g,'')
     .replace(/[「」（）()]/g,' ').replace(/。+/g,'。').replace(/^[。，\s]+/,'').replace(/\s+/g,' ');
  return t.trim();}
function estMs(t){return t?Math.max(700,t.length*255/TTS.rate+250):0;}
let SPK=0,spkBtn=null;
function stopSpeak(){SPK++;if(TTS.ok)try{speechSynthesis.cancel();}catch(e){}if(spkBtn){spkBtn.classList.remove('speaking');spkBtn=null;}}
/* 唸一段文字；回傳的 Promise 在唸完時結束，p.est 是預估秒數（給動畫對時間用） */
function speak(html,o={}){const text=speechText(html);let p;
  if(!TTS.ok||(!TTS.on&&!o.force)||!text){p=Promise.resolve();p.est=0;return p;}
  stopSpeak();const tok=SPK;if(o.btn){spkBtn=o.btn;o.btn.classList.add('speaking');}
  const parts=text.split(/(?<=[。！？!?])/).map(x=>x.trim()).filter(x=>x.replace(/[。！？，\s]/g,''));
  p=new Promise(res=>{let i=0;const v=curVoice();
    const finish=()=>{if(tok===SPK&&spkBtn===o.btn&&o.btn){o.btn.classList.remove('speaking');spkBtn=null;}res();};
    const next=()=>{if(tok!==SPK||i>=parts.length){finish();return;}
      const u=new SpeechSynthesisUtterance(parts[i++]);if(v){u.voice=v;u.lang=v.lang;}else u.lang='zh-TW';u.rate=TTS.rate;u.pitch=1.05;
      let done=false;const go=()=>{if(done)return;done=true;clearTimeout(g);setTimeout(next,i<parts.length?180:0);};
      const g=setTimeout(go,estMs(u.text)*1.6+3000);u.onend=go;u.onerror=go;
      try{speechSynthesis.speak(u);}catch(e){go();}};
    setTimeout(next,80);});
  p.est=estMs(text);return p;}
/* 動畫要配合唸讀：動畫時間至少跟唸的時間差不多 */
const syncDur=(p,base)=>Math.max(base,(p&&p.est)?p.est*0.8:0);
async function after(p,ms,id){await p;return wait(p&&p.est?450:ms,id);}
/* iOS／Chrome 需要在第一次點擊時「解鎖」語音 */
let ttsUnlocked=false;
document.addEventListener('pointerdown',()=>{if(ttsUnlocked||!TTS.ok)return;ttsUnlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);speechSynthesis.resume();}catch(e){}},true);

function fillVoiceSelect(){const sel=$('#ttsVoice');if(!sel)return;sel.innerHTML='';
  if(!TTS.ok){$('#ttsNote').textContent='這個瀏覽器不支援唸讀。建議改用 Chrome、Edge 或 Safari。';return;}
  if(!TTS.voices.length){$('#ttsNote').textContent='這台裝置沒有找到中文語音。請到系統設定下載「中文（台灣）」語音。';return;}
  const cur=curVoice();TTS.voices.forEach(v=>{const op=HT('option',{text:`${v.name}（${v.lang}）`,value:v.voiceURI},sel);if(cur&&v.voiceURI===cur.voiceURI)op.selected=true;});
  $('#ttsNote').textContent='小技巧：Windows 的 Edge 有「Microsoft HsiaoChen Online (Natural)」最像真人；iPad 可在「設定 → 輔助使用 → 朗讀內容 → 聲音」下載「美佳（加強版）」。';}
function refreshTtsUI(){$('#btnAuto').textContent=`🔊 自動唸讀：${TTS.on?'開':'關'}`;
  document.querySelectorAll('#ttsRates button').forEach(b=>b.classList.toggle('sel',Math.abs(Number(b.dataset.r)-TTS.rate)<.01));}
$('#btnAuto').onclick=()=>{TTS.on=!TTS.on;if(!TTS.on)stopSpeak();saveTTS();refreshTtsUI();};
$('#btnTtsSet').onclick=()=>{loadVoices();$('#ttsPanel').classList.toggle('on');};

function tween(dur,fn,id){return new Promise(res=>{const t0=performance.now();function step(t){if(id!==undefined&&id!==RUN){res(false);return;}const k=Math.min(1,(t-t0)/dur);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;fn(e);if(k<1)requestAnimationFrame(step);else res(true);}requestAnimationFrame(step);});}

/* ========== 三角板 ========== */
const RT={
  iso:{name:'等腰直角三角板',a:240,b:240,fill:'rgba(255,204,51,.52)',stroke:'#B88A00',tick:'#6d5200'},
  alt:{name:'另一種直角三角板',a:290,b:168,fill:'rgba(96,178,236,.48)',stroke:'#1F6FB2',tick:'#163f66'}
};
function poseTf(p){return `translate(${p.x} ${p.y}) rotate(${p.r}) scale(1 ${p.f})`;}
function corners(p,type){const R=RT[type];const C0={x:p.x,y:p.y};return{C0,C1:add(C0,dir(p.r),R.a),C2:add(C0,dir(p.r-90*p.f),R.b)};}
function buildRuler(g,type,f,opt={}){
  g.innerHTML='';const R=RT[type];const pts=`0,0 ${R.a},0 0,${-R.b}`;
  if(opt.ghost){E('polygon',{points:pts,fill:'rgba(46,158,106,.16)',stroke:'#2E9E6A','stroke-width':4,'stroke-dasharray':'12 9'},g);
    E('path',{d:'M0,-20 L20,-20 L20,0',fill:'none',stroke:'#2E9E6A','stroke-width':3},g);return g;}
  E('polygon',{points:pts,fill:R.fill,stroke:R.stroke,'stroke-width':2.5,'stroke-linejoin':'round','data-drag':'ruler',class:'rulerbody'},g);
  // 內框（像真的三角板）
  const k=.42,ox=R.a*.17,oy=-R.b*.17;
  E('polygon',{points:`${ox},${oy} ${ox+R.a*k},${oy} ${ox},${oy-R.b*k}`,fill:'rgba(255,255,255,.35)',stroke:R.stroke,'stroke-width':1.2,'pointer-events':'none'},g);
  for(let x=15;x<R.a-18;x+=15){const big=x%30===0;
    E('line',{x1:x,y1:0,x2:x,y2:-(big?14:8),stroke:R.tick,'stroke-width':1.5,'pointer-events':'none'},g);
    if(big)E('text',{'font-size':12,fill:R.tick,'text-anchor':'middle','dominant-baseline':'middle','pointer-events':'none',transform:`translate(${x} -25) scale(1 ${f})`,text:String(x/30)},g);}
  E('path',{d:'M0,-22 L22,-22 L22,0',fill:'none',stroke:'#D63A2F','stroke-width':3.5,'pointer-events':'none'},g);
  E('circle',{cx:0,cy:0,r:5,fill:'#D63A2F','pointer-events':'none'},g);
  if(opt.handle){
    const L=Math.hypot(R.a,R.b),n={x:R.b/L,y:-R.a/L};const M={x:R.a/2+n.x*40,y:-R.b/2+n.y*40};
    const hg=E('g',{'data-drag':'rot',class:'rothandle',transform:`translate(${M.x} ${M.y})`},g);
    E('line',{x1:-n.x*40,y1:-n.y*40,x2:0,y2:0,stroke:'#2E9E6A','stroke-width':3,'stroke-dasharray':'4 4'},hg);
    E('circle',{r:25,fill:'#fff',stroke:'#2E9E6A','stroke-width':4},hg);
    E('path',{d:'M-11,4 A12,12 0 1 1 4,11',fill:'none',stroke:'#2E9E6A','stroke-width':4,'stroke-linecap':'round'},hg);
    E('path',{d:'M-3,4 L-12,8 L-14,-2',fill:'none',stroke:'#2E9E6A','stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round'},hg);
  }
  return g;
}
const RU={pose:null,type:'iso',g:null,wrap:null,enabled:false};

function rulerShow(pose){RU.pose={...pose};RU.wrap=E('g',{},LY.ruler);RU.g=E('g',{},RU.wrap);rulerRebuild();}

function setPose(p){const fc=p.f!==RU.pose.f;RU.pose={...p};if(fc)rulerRebuild();else RU.g.setAttribute('transform',poseTf(RU.pose));}
async function animatePose(to,dur,id){const fr={...RU.pose};if(fr.f!==to.f){setPose({...fr,f:to.f});fr.f=to.f;}
  const dr=n180(to.r-fr.r);return tween(dur,e=>setPose({x:fr.x+(to.x-fr.x)*e,y:fr.y+(to.y-fr.y)*e,r:fr.r+dr*e,f:to.f}),id);}

/* ========== 拖曳 ========== */
let drag=null,TAP=null,RAYDRAG=null;const HOOK={touch:null};
function svgPt(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
svg.addEventListener('pointerdown',e=>{
  const t=e.target.closest('[data-drag],[data-tap]');if(!t)return;const p=svgPt(e);
  if(t.dataset.tap!==undefined){if(TAP)TAP(t.dataset.tap);return;}
  const kind=t.dataset.drag;
  if((kind==='ruler'||kind==='rot')&&!RU.enabled)return;
  if(kind==='ray'&&!RAYDRAG)return;
  e.preventDefault();try{svg.setPointerCapture(e.pointerId);}catch(_){}
  if(kind==='ruler')drag={kind,dx:RU.pose.x-p.x,dy:RU.pose.y-p.y};
  else if(kind==='rot')drag={kind,a0:angOf({x:p.x-RU.pose.x,y:p.y-RU.pose.y}),r0:RU.pose.r};
  else drag={kind};
  if(kind!=='ray'&&HOOK.touch)HOOK.touch();
});
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=svgPt(e);
  if(drag.kind==='ruler')setPose({...RU.pose,x:clamp(p.x+drag.dx,0,1000),y:clamp(p.y+drag.dy,0,620)});
  else if(drag.kind==='rot')setPose({...RU.pose,r:drag.r0+n180(angOf({x:p.x-RU.pose.x,y:p.y-RU.pose.y})-drag.a0)});
  else if(drag.kind==='ray'&&RAYDRAG)RAYDRAG(p);});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>svg.addEventListener(ev,()=>{drag=null;}));

/* ========== 角 ========== */
const rays=a=>[a.th1,a.th1+a.s*a.alpha];
const rayEnd=(a,j)=>add(a.V,dir(rays(a)[j]),j?a.L2:a.L1);
function sectorPath(V,R,a1,a2){const p1=add(V,dir(a1),R),p2=add(V,dir(a2),R);const sw=n180(a2-a1)>0?1:0;return `M${V.x},${V.y} L${p1.x},${p1.y} A${R},${R} 0 0 ${sw} ${p2.x},${p2.y} Z`;}
function drawAngle(ang,mode){
  LY.angle.innerHTML='';LY.shade.innerHTML='';const V=ang.V,R=rays(ang),P=[rayEnd(ang,0),rayEnd(ang,1)];
  if(mode==='shaded')E('path',{d:sectorPath(V,Math.min(ang.L1,ang.L2)*.65,R[0],R[1]),fill:'rgba(255,208,80,.5)',id:'shadeA'},LY.shade);
  if(mode==='marked'){
    const cols=['#2F7FD1','#EF7D1A'];const bis=R[0]+n180(R[1]-R[0])/2;
    for(let j=0;j<2;j++){E('line',{x1:V.x,y1:V.y,x2:P[j].x,y2:P[j].y,stroke:cols[j],'stroke-width':7,'stroke-linecap':'round'},LY.angle);
      const side=sgn(cross(dir(R[j]),dir(bis)))||1;const m=add(add(V,dir(R[j]),(j?ang.L2:ang.L1)*.62),dir(R[j]-90*side),26);
      E('text',{x:m.x,y:m.y,'font-size':22,'font-weight':900,fill:cols[j],'text-anchor':'middle','dominant-baseline':'middle',text:'邊'},LY.angle);}
    E('circle',{cx:V.x,cy:V.y,r:11,fill:'#E0453A',stroke:'#fff','stroke-width':3},LY.angle);
    const lp=add(V,dir(bis+180),38);E('text',{x:lp.x,y:lp.y,'font-size':22,'font-weight':900,fill:'#E0453A','text-anchor':'middle','dominant-baseline':'middle',text:'頂點'},LY.angle);
  }else{for(let j=0;j<2;j++)E('line',{x1:V.x,y1:V.y,x2:P[j].x,y2:P[j].y,stroke:'#333','stroke-width':4.5,'stroke-linecap':'round'},LY.angle);}
}
function rightMark(V,a1,a2,size,layer,color='#D63A2F'){const p1=add(V,dir(a1),size),p3=add(V,dir(a2),size),p2=add(p1,dir(a2),size);
  return E('path',{d:`M${p1.x},${p1.y} L${p2.x},${p2.y} L${p3.x},${p3.y}`,fill:'none',stroke:color,'stroke-width':4},layer);}
function fits(ang){const pts=[ang.V];for(let j=0;j<2;j++){const L=j?ang.L2:ang.L1;for(let t=10;t<=L;t+=15)pts.push(add(ang.V,dir(rays(ang)[j]),t));}
  return pts.every(p=>p.x>40&&p.x<960&&p.y>40&&p.y<585&&!(p.x<420&&p.y>300));}
function makeAngle(alpha,o={}){
  for(let t=0;t<800;t++){const ang={alpha,th1:o.fixed?0:rnd(0,360),s:o.fixed?-1:(Math.random()<.5?1:-1),L1:o.L1?o.L1():rnd(230,260),L2:o.L2?o.L2():rnd(230,260),V:{x:rnd(430,900),y:rnd(60,570)}};
    if(fits(ang))return ang;}
  return{alpha,th1:0,s:-1,L1:220,L2:220,V:{x:640,y:420}};
}
const classify=a=>a===90?'right':a<90?'acute':'obtuse';

/* ========== 判定 ========== */
function evalPose(pose,type,ang){
  const K=corners(pose,type),V=ang.V,R=rays(ang),Lg=[pose.r,pose.r-90*pose.f];
  if(dist(K.C0,V)>12){if(dist(K.C1,V)<25||dist(K.C2,V)<25)return{err:'D'};return{err:'A'};}
  const same=[],anti=[];
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){const d=adiff(Lg[i],R[j]);if(d<3)same.push({i,j,d});else if(d>177)anti.push({i,j});}
  same.sort((a,b)=>a.d-b.d);
  for(const p of same){const k=1-p.i,m=1-p.j,u=dir(R[p.j]);if(sgn(cross(u,dir(Lg[k])))===sgn(cross(u,dir(R[m]))))return{ok:true,pair:p};}
  if(same.length||anti.length)return{err:'C',pair:same[0]||anti[0]};
  return{err:'B'};
}
function idealPose(ang,pose){const R=rays(ang);const j=adiff(pose.r,R[0])<=adiff(pose.r,R[1])?0:1;const m=1-j;
  const tg=sgn(cross(dir(R[j]),dir(R[m])));return{x:ang.V.x,y:ang.V.y,r:R[j],f:tg<0?1:-1};}

/* ========== 量角任務（共用） ========== */
let T=null;
const HINT1={D:'要用三角板最大的角，也就是<b>直角</b>，來比喔！',A:'三角板<b>直角的尖尖</b>，有對準角的<b>頂點</b>嗎？',B:'三角板的邊，有和角的<b>一條邊貼在一起</b>嗎？',C:'三角板要蓋在<b>角的裡面</b>，朝另一條邊轉過去喔！'};

  compare:[{label:'比直角小',val:'acute'},{label:'一樣大（是直角）',val:'right'},{label:'比直角大',val:'obtuse'}]};

  compare:{acute:'另一條邊在三角板<b>裡面</b>，所以<b>比直角小</b>！',right:'另一條邊和三角板的邊<b>重疊</b>，和直角<b>一樣大</b>！',obtuse:'另一條邊在三角板<b>外面</b>，所以<b>比直角大</b>！'}};

function startMeasure(cfg){
  T=Object.assign({phase:'place',placeFails:0,help:false,maxHint:0,judgeTries:0,mistakes:0,seen:{},pair:null,errs:{A:0,B:0,C:0,D:0},busy:false,labels:'names'},cfg);
  drawAngle(T.ang,T.mode);RU.type=S.rulerType;rulerShow(START_POSE);RU.enabled=true;
  setLights(T.strict?null:['off','off','off']);
  HOOK.touch=()=>{LY.over.innerHTML='';unpulse();const sh=document.getElementById('shadeA');if(sh)sh.classList.remove('blink');};
  setTools(T.strict?{check:1,rot:1,flip:1,swap:1,reset:1}:{check:1,rot:1,flip:1,swap:1,reset:1,help:1});
  setChoices([]);
}
function lightsFromEval(ev){if(!T||T.strict)return;const l=['off','off','off'];
  if(ev.err==='D'||ev.err==='A')l[0]='bad';else{l[0]='on';if(ev.err==='B')l[1]='bad';else{l[1]='on';l[2]=ev.err==='C'?'bad':'on';}}setLights(l);}
function onCheck(){
  if(!T||T.phase!=='place'||T.busy)return;
  const ev=evalPose(RU.pose,RU.type,T.ang);lightsFromEval(ev);
  if(ev.ok){placedOK(ev);return;}
  T.placeFails++;T.errs[ev.err]++;
  if(T.strict){T.mistakes++;msg('再試一次！','warn');if(T.onMistake)T.onMistake();return;}
  let lv=T.H[ev.err];if(T.seen[ev.err]){lv=Math.min(T.cap,lv+1);T.H[ev.err]=lv;}T.seen[ev.err]=true;
  showHint(ev,lv);
}
function onHelp(){
  if(!T||T.phase!=='place'||T.busy||T.strict)return;
  const ev=evalPose(RU.pose,RU.type,T.ang);
  if(ev.ok){msg('你已經放對了！按「我放好了」吧。','good');return;}
  T.help=true;T.errs[ev.err]++;const lv=Math.min(T.cap,T.H[ev.err]+1);T.H[ev.err]=lv;T.seen[ev.err]=true;lightsFromEval(ev);showHint(ev,lv);
}
async function showHint(ev,lv){
  T.maxHint=Math.max(T.maxHint,lv);LY.over.innerHTML='';unpulse();
  const tag=`<span style="font-size:15px;color:#999">（提示第 ${lv} 層）</span><br>`;
  if(lv===0){msg(tag+'再檢查一下喔！','warn');return;}

const RANGE={1:{acute:[30,60],obtuse:[120,150]},2:{acute:[60,80],obtuse:[100,120]},3:{acute:[80,85],obtuse:[95,100]}};
const MODE={1:'marked',2:'shaded',3:'plain'},CAP={1:4,2:3,3:0};
let L=null;
function buildPlan(n){const kinds=shuffle(['acute','acute','acute','obtuse','obtuse','obtuse','right','right']);
  if(n<3)return kinds.map((k,i)=>({type:'measure',kind:k,fixed:n===1&&i<3}));
  const shortSet=new Set(shuffle([0,1,2,3,4,5,6,7]).slice(0,3));const m=kinds.map((k,i)=>({type:'measure',kind:k,short:shortSet.has(i)}));
  return[...m.slice(0,5),{type:'trap'},...m.slice(5),{type:'boss'}];}
function startLevel(n){if(!S.rec.unlocked['L'+n])return;L={n,idx:0,plan:buildPlan(n),results:[],hearts:3,H:{A:1,B:1,C:1,D:1},streak:0,errors:{A:0,B:0,C:0,D:0},stars:0};levelQ();}
function levelHead(){setupPlay(LV[L.n].name,`第 ${L.idx+1} / ${L.plan.length} 題`);setScore({stars:L.stars,hearts:L.n===3?L.hearts:undefined});}
function loseHeart(){L.hearts=Math.max(0,L.hearts-1);setScore({stars:L.stars,hearts:L.hearts});if(L.hearts<=0){const id=RUN;RU.enabled=false;lockChoices();setTools({});msg('愛心用完了……','warn');setTimeout(()=>{if(id===RUN)endLevel(true);},1300);}}
function levelQ(){levelHead();const q=L.plan[L.idx];
  if(q.type==='trap')return trapQ();if(q.type==='boss')return bossQ();
  let alpha=q.kind==='right'?90:rint(...RANGE[L.n][q.kind]);
  const o={fixed:q.fixed};if(L.n===2){o.L1=()=>rnd(130,260);o.L2=()=>rnd(130,260);}
  if(L.n===3){const sj=Math.random()<.5;o.L1=()=>q.short&&sj?rnd(70,95):rnd(195,260);o.L2=()=>q.short&&!sj?rnd(70,95):rnd(195,260);}
  const ang=makeAngle(alpha,o);
  startMeasure({ang,mode:MODE[L.n],cap:CAP[L.n],strict:L.n===3,H:L.H,sess:L,labels:'names',onMistake:loseHeart,onDone:finishQ});
  if(L.n===3)msg('大師挑戰：自己量量看，這是什麼角？');
  else if(L.idx===0)msg('移動三角板量量看：這是什麼角？<br>記得三步驟：<b>直角對頂點 → 貼齊一條邊 → 蓋在角的裡面</b>，放好後按「我放好了」。');
  else msg('移動三角板量量看，這是什麼角？');}
function finishQ(r){L.results.push(r);L.stars+=r.stars;for(const k in L.errors)L.errors[k]+=(r.errs&&r.errs[k])||0;
  setScore({stars:L.stars,hearts:L.n===3?L.hearts:undefined});setTools({});RU.enabled=false;
  const last=L.idx>=L.plan.length-1;setNav([{label:last?'看結果 ▶':'下一題 ▶',cls:'primary',fn:()=>{if(last)endLevel(false);else{L.idx++;levelQ();}}}]);
  $('#msg').innerHTML+=`<br><span style="color:#E0A100">${'★'.repeat(r.stars)}${'☆'.repeat(3-r.stars)}</span>`;}
function trapQ(){T=null;const id=RUN;const v=rint(0,2);
  const cfg=[{a:[45,65],L:[300,110],R:[160,40],ans:'right'},{a:[55,55],L:[300,120],R:[50,95],ans:'same'},{a:[72,52],L:[120,300],R:[90,60],ans:'left'}][v];
  const Vs=[{x:110,y:500},{x:580,y:500}];let tries=0;
  Vs.forEach((V,i)=>{const a=cfg.a[i],Ln=cfg.L[i],r=cfg.R[i];const e1=add(V,dir(0),Ln),e2=add(V,dir(-a),Ln);
    E('line',{x1:V.x,y1:V.y,x2:e1.x,y2:e1.y,stroke:'#333','stroke-width':5,'stroke-linecap':'round'},LY.angle);E('line',{x1:V.x,y1:V.y,x2:e2.x,y2:e2.y,stroke:'#333','stroke-width':5,'stroke-linecap':'round'},LY.angle);
    E('path',{d:`M${V.x+r},${V.y} A${r},${r} 0 0 0 ${V.x+r*Math.cos(a*D2R)},${V.y-r*Math.sin(a*D2R)}`,fill:'none',stroke:i?'#2F7FD1':'#E0453A','stroke-width':5},LY.angle);
    svgText(V.x+40,V.y+50,i?'右邊的角':'左邊的角',{size:26,fill:'#555'},LY.angle);});

  setChoices([{label:'左邊的角比較大',val:'left'},{label:'右邊的角比較大',val:'right'},{label:'一樣大',val:'same'}],(c,b)=>{
    if(L.hearts<=0)return;
    if(c===cfg.ans){b.classList.add('chosen-ok');lockChoices();msg('答對了！角的大小只看兩條邊<b>張開多少</b>，和邊的長短、弧線大小沒有關係。','good');
      finishQ({correct:tries===0,stars:tries===0?3:2,errs:{},maxHint:0,firstTry:tries===0,help:false,mistakes:tries});}
    else{tries++;b.classList.add('chosen-bad');b.disabled=true;msg('再試一次！','warn');loseHeart();}});}
const BOSS=[[[-110,110],[110,110],[110,-20],[0,-130],[-110,-20]],[[-120,100],[130,100],[60,-60],[-40,-120],[-120,-20]]];
function bossQ(){T=null;const shape=BOSS[rint(0,1)],rot=rnd(-35,35),C={x:640,y:300};let tries=0;
  const P=shape.map(([x,y])=>{const c=Math.cos(rot*D2R),s=Math.sin(rot*D2R);return{x:C.x+x*c-y*s,y:C.y+x*s+y*c};});
  const isR=P.map((p,i)=>{const a=P[(i+P.length-1)%P.length],b=P[(i+1)%P.length];const u=angOf({x:a.x-p.x,y:a.y-p.y}),w=angOf({x:b.x-p.x,y:b.y-p.y});return Math.abs(adiff(u,w)-90)<1;});
  E('polygon',{points:P.map(p=>`${p.x},${p.y}`).join(' '),fill:'rgba(142,68,173,.06)',stroke:'#6B3FA0','stroke-width':5,'stroke-linejoin':'round'},LY.angle);
  RU.type=S.rulerType;rulerShow(START_POSE);RU.enabled=true;HOOK.touch=null;

    tg.querySelectorAll('circle').forEach((c,i)=>c.setAttribute('stroke',sel.has(i)?'#D63A2F':'#999'));};
  const tg=E('g',{},LY.top);P.forEach((p,i)=>E('circle',{cx:p.x,cy:p.y,r:24,fill:'rgba(255,255,255,0.01)',stroke:'#999','stroke-width':3,'stroke-dasharray':'5 4','data-tap':String(i),style:'cursor:pointer'},tg));
  TAP=k=>{if(L.hearts<=0)return;const i=Number(k);sel.has(i)?sel.delete(i):sel.add(i);redraw();};
  msg('👑 <b>魔王題</b>：這個五邊形裡，<b>哪些角是直角</b>？<br>用三角板量一量，點選<b>所有</b>的直角（會出現 ∟），再按「完成」。');
  setChoices([{label:'完成',val:'done',cls:'primary'}],()=>{if(L.hearts<=0)return;const ok=isR.every((r,i)=>r===sel.has(i));
    if(ok){TAP=null;RU.enabled=false;lockChoices();msg('太厲害了！魔王被你打敗了！👑','good');finishQ({correct:tries===0,stars:tries===0?3:2,errs:{},maxHint:0,firstTry:tries===0,help:false,mistakes:tries});}
    else{tries++;msg('再試一次！','warn');loseHeart();}});}
function endLevel(heartsOut){stopAll();const n=L.n,R=L.results,correct=R.filter(r=>r.correct).length,total=L.plan.length;
  const maxHint=R.reduce((m,r)=>Math.max(m,r.maxHint||0),0);const noHint=R.filter(r=>r.firstTry&&!r.help).length;let passed=false;
  if(!heartsOut&&R.length===total){if(n===1)passed=correct>=6&&R.slice(-3).every(r=>(r.maxHint||0)<3);

  const rec=S.rec;const lr=rec.levels[n]||(rec.levels[n]={tries:0,best:null,last:null,everPassed:false});lr.tries++;lr.last=st;

  const yn=v=>v===undefined?'-':v?'對':'錯';
  const rows=Object.values(DB.students).sort((a,b)=>Number(a.seat)-Number(b.seat)).map(r=>{const row=[r.seat,r.review.stations.filter(Boolean).length,r.review.quizTries,r.review.ticket?'有':'無',yn(r.review.recog.A),yn(r.review.recog.B),yn(r.review.recog.C),yn(r.review.recog.D)];
    [1,2,3].forEach(n=>{const l=r.levels[n];if(!l){row.push(0,'-','-','-','-','-','-','-','-');return;}const s=l.last;row.push(l.tries,l.everPassed?'是':'否',`${s.correct}/${s.total}`,s.stars,s.errors.A,s.errors.B,s.errors.C,s.errors.D,n===3?'-':s.maxHint);});
    const d=new Date(r.updated);row.push(`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`);return row;});
  return{head,rows};}
function showTeacher(){stopAll();show('teacher');const{head,rows}=teacherRows();const t=$('#tTable');
  t.innerHTML='<tr>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr>'+(rows.length?rows.map(r=>'<tr>'+r.map(v=>`<td>${v}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${head.length}">目前還沒有紀錄</td></tr>`);
  $('#csvOut').value='﻿'+[head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');}
$('#btnCopy').onclick=async()=>{const v=$('#csvOut').value;try{await navigator.clipboard.writeText(v);$('#tInfo').textContent='已複製！';}catch(e){$('#csvOut').select();$('#tInfo').textContent='請按 Ctrl+C（或長按）複製選取的文字。';}};
$('#btnTSkip').onclick=()=>{const v=parseInt($('#tSeat').value,10);if(!(v>=1&&v<=99)){$('#tInfo').textContent='請先輸入座號。';return;}
  const r=getRec(String(v));Object.assign(r.unlocked,{quiz:true,L1:true,L2:true,L3:true});save();$('#tInfo').textContent=`座號 ${v} 已解鎖全部關卡。`;showTeacher();};
let clearArm=0;$('#btnTClear').onclick=()=>{if(Date.now()-clearArm<4000){DB={students:{}};saveDB();clearArm=0;$('#btnTClear').textContent='清除全部紀錄';$('#tInfo').textContent='已清除。';showTeacher();}
  else{clearArm=Date.now();$('#btnTClear').textContent='⚠ 再按一次確認清除';setTimeout(()=>{$('#btnTClear').textContent='清除全部紀錄';},4000);}};

/* 開始 */
goHome();
</script>
